<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Waste2Worth - Sign in</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="site-nav"><div class="wrap"><a href="index.html" class="brand">Waste2<span>Worth</span></a><a href="index.html">Back to home</a></div></nav>
<main class="wrap auth-shell"><div class="section-head"><h1 id="authTitle">Sign in</h1><p class="lede">Use your verified Waste2Worth account to save analyses and impact activity.</p></div>
<div class="auth-tabs"><button id="loginTab" class="btn btn-primary" type="button">Sign in</button><a href="signup.html" class="btn btn-secondary">Create account</a></div>
<form id="authForm" class="upload-panel"><label>Email<input id="authEmail" type="email" autocomplete="email" required></label><label>Password<input id="authPassword" type="password" minlength="8" autocomplete="current-password" required></label><label id="confirmPasswordWrap" hidden>Confirm password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"></label><button id="authSubmit" class="btn btn-primary" type="submit">Sign in</button><button id="resendVerification" class="btn btn-secondary" type="button" hidden>Resend verification email</button><p id="authMessage" class="error-message" role="alert"></p></form>
</main><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
