<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Waste2Worth - Create account</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="site-nav"><div class="wrap"><a href="index.html" class="brand">Waste2<span>Worth</span></a><a href="auth.html">Sign in</a></div></nav>
<main class="wrap auth-shell"><div class="section-head"><h1>Create your Waste2Worth account</h1><p class="lede">Create an account, verify your email, and then save your analyses and impact activity securely.</p></div>
<form id="authForm" class="upload-panel"><label id="fullNameWrap">Full name<input id="fullName" autocomplete="name" maxlength="120" required></label><label>Email<input id="authEmail" type="email" autocomplete="email" required></label><label id="phoneWrap">Phone number<input id="phone" type="tel" autocomplete="tel" maxlength="30" required></label><label id="locationWrap">City or location<input id="location" autocomplete="address-level2" maxlength="160" required></label><label>Password<input id="authPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button id="authSubmit" class="btn btn-primary" type="submit">Create account</button><button id="resendVerification" class="btn btn-secondary" type="button" hidden>Resend verification email</button><p id="authMessage" class="error-message" role="alert"></p></form>
</main><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
