<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analysis Result - Waste2Worth</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">Waste2<span>Worth</span></a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-controls="primary-navigation" aria-expanded="false">Menu</button>
    <ul class="nav-links" id="primary-navigation">
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Upload</a></li>
      <li><a href="marketplace.html">Marketplace</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </div>
</nav>

<section class="wrap" id="resultRoot">
  <div class="section-head">
    <h1>Here's what we found</h1>
  </div>

  <div class="result-card">
    <div class="result-header">
      <div>Detected item</div>
      <div class="item-name" id="resultItem">-</div>
    </div>
    <div class="result-body">
    <form id="resultEditForm" class="result-edit-form">
      <div class="form-grid">
        <label>
          Item name
          <input id="editItem" name="item" maxlength="200" required>
        </label>
        <label>
          Material
          <input id="editMaterial" name="material" maxlength="120" required>
        </label>
      </div>
      <button class="btn btn-secondary" type="submit">Save corrections</button>
      <p class="form-message" id="resultEditMessage" role="status"></p>
    </form>
    <div class="result-grid">
        <div class="result-field">
          <div class="label">Condition</div>
          <div class="value" id="resultCondition">-</div>
        </div>
        <div class="result-field">
          <div class="label">Estimated value</div>
          <div class="value accent" id="resultValue">-</div>
        </div>
      </div>

      <div class="result-field" style="margin-bottom:20px;">
        <div class="label">Recommended action</div>
        <div class="action-row" id="resultActions"></div>
      </div>

      <div class="result-field" style="margin-bottom:20px;">
        <div class="label">Material</div>
        <div class="value" id="resultMaterial">-</div>
      </div>
      <p class="analysis-confidence" id="resultConfidence"></p>

      <div class="explanation" id="resultExplanation"></div>
      <img id="resultImage" class="result-image" alt="Uploaded item">

      <div class="btn-row">
        <a href="services.html" class="btn btn-primary">Find Services</a>
        <a href="marketplace.html" class="btn btn-secondary">List For Sale</a>
        <a href="upcycle.html" class="btn btn-accent">Explore Upcycling Ideas</a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>Waste2Worth</span>
    <span>Analysis generated by the Waste2Worth AI service.</span>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
