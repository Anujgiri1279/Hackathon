<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcycling Ideas - Waste2Worth</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">Waste2<span>Worth</span></a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-controls="primary-navigation" aria-expanded="false">Menu</button>
    <ul class="nav-links" id="primary-navigation">
      <li><a href="index.html">Home</a></li>
      <li><a href="upload.html">Upload</a></li>
      <li><a href="marketplace.html">Marketplace</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="upcycle.html" class="active">Upcycle</a></li>
    </ul>
  </div>
</nav>

<section class="wrap">
  <div class="section-head">
    <h1>Upcycling ideas</h1>
    <p class="lede">Generate practical ideas from the item and material you have.</p>
  </div>

  <form id="upcycleForm" class="upload-panel">
    <div class="form-grid">
      <label>Item<input name="itemName" placeholder="e.g. plastic bottle" required></label>
      <label>Material<input name="material" placeholder="e.g. plastic" required></label>
      <label>Number of ideas<select name="quantity"><option value="4">4 ideas</option><option value="6" selected>6 ideas</option><option value="10">10 ideas</option></select></label>
    </div>
    <button class="btn btn-primary" type="submit">Generate ideas</button>
    <p class="error-message" id="upcycleMessage" role="status"></p>
  </form>
  <form id="upcycleImageForm" class="upload-panel">
    <label>Upload a photo of one or more items
      <input id="upcycleImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    </label>
    <p id="upcycleImageName" class="muted" aria-live="polite">No image selected</p>
    <img id="upcycleImagePreview" class="upcycle-image-preview" alt="Selected item preview" hidden>
    <button class="btn btn-secondary" type="submit">Scan image again</button>
  </form>
  <section id="upcycleDetected" class="upload-panel" hidden>
    <h2>Detected items</h2>
    <p id="upcycleDetectedItems" class="muted"></p>
  </section>
  <section class="upcycle-settings" aria-label="Search and filter generated ideas">
    <label>Search results<input id="upcycleSearch" type="search" placeholder="Search planter, storage, easy..."></label>
    <label>Difficulty<select id="upcycleDifficulty"><option value="">All difficulties</option><option>Easy</option><option>Medium</option><option>Advanced</option></select></label>
    <label>Sort by<select id="upcycleSort"><option value="relevance">Best match</option><option value="difficulty">Difficulty</option><option value="time">Time</option><option value="title">Title</option></select></label>
    <button id="clearUpcycleSettings" class="btn btn-secondary" type="button">Clear filters</button>
  </section>
  <p id="upcycleCount" class="muted" aria-live="polite"></p>
  <div class="card-grid" id="upcycleGrid"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>Waste2Worth</span>
    <span>Ideas are generated by the Waste2Worth AI service.</span>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
